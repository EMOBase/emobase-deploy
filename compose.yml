volumes:
  es-data:
    driver: local
  directus-data:
    driver: local

# Shared by the Directus service and its one-shot setup job. The setup job
# reuses Directus's network namespace (to reach its API on localhost), so it
# must not declare its own networks/network_mode conflict.
x-directus-environment: &directus-environment
  SECRET: ${DIRECTUS_SECRET}
  DB_CLIENT: mysql
  DB_HOST: ${DIRECTUS_DB_HOST:-mysql}
  DB_PORT: ${DIRECTUS_DB_PORT:-3306}
  DB_DATABASE: ${DIRECTUS_DB_DATABASE:-directus}
  DB_USER: ${DIRECTUS_DB_USER:-root}
  DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
  ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL}
  ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD}
  PROJECT_OWNER: ${DIRECTUS_ADMIN_EMAIL}
  PUBLIC_URL: ${PUBLIC_SERVER}/ibb/directus
  AUTH_PROVIDERS: keycloak
  AUTH_KEYCLOAK_DRIVER: openid
  AUTH_KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-ibb-client}
  AUTH_KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
  # Directus joins the shared infra network, so it uses Keycloak's internal
  # service URL. The browser-facing issuer is KEYCLOAK_PUBLIC_URL.
  AUTH_KEYCLOAK_ISSUER_URL: ${DIRECTUS_KEYCLOAK_ISSUER_URL:-${KEYCLOAK_INTERNAL_URL:-http://keycloak:8080/keycloak}/realms/${KEYCLOAK_REALM:-ibb}}
  AUTH_KEYCLOAK_IDENTIFIER_KEY: preferred_username
  AUTH_KEYCLOAK_ALLOW_PUBLIC_REGISTRATION: "true"
  AUTH_KEYCLOAK_REDIRECT_ALLOW_LIST: ${PUBLIC_SERVER}/ibb/directus
  AUTH_KEYCLOAK_DEFAULT_ROLE_ID: 64f31dc8-7465-4416-b1eb-ef6efd990de9
  TELEMETRY: "false"

services:

  nginx:
    image: nginx:1.19
    restart: always
    ports:
      - ${HTTP_PORT:-80}:80
    environment:
      # Substituted into nginx.conf.template by the image entrypoint.
      - PORTAL_INTERNAL_URL=${PORTAL_INTERNAL_URL:-${PORTAL_SERVER}}
      - NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      - ${PUBLIC_DATA_DIR}:/download/:ro

  fe:
    image: ${EMOBASE_WEB_IMAGE:-ghcr.io/emobase/emobase-web:dev}
    restart: always
    environment:
      - PUBLIC_SERVER=${PUBLIC_SERVER}
      - PUBLIC_MAIN_SPECIES=${MAIN_SPECIES}
      - PUBLIC_APIS_BASE_URL=${PUBLIC_SERVER}/ibb/api
      # Genomics, JBrowse2 and BLAST are served by the portal deployment.
      - PUBLIC_API_GENOMICS_SERVICE=${PORTAL_SERVER}/api/genomicsservice/v1
      # Server-side calls use these internal URLs instead of the public URL.
      # They fall back to the matching PUBLIC_* URL when omitted.
      - INTERNAL_API_GENOMICS_SERVICE=${INTERNAL_API_GENOMICS_SERVICE:-${PORTAL_INTERNAL_URL:-${PORTAL_SERVER}}/api/genomicsservice/v1}
      - INTERNAL_API_PHENOTYPE_SERVICE=${INTERNAL_API_PHENOTYPE_SERVICE:-http://phenotypeservice:8080}
      - INTERNAL_API_IMAGE_SERVICE=${INTERNAL_API_IMAGE_SERVICE:-http://imageservice:8080}
      - INTERNAL_API_ONTOLOGY_SERVICE=${INTERNAL_API_ONTOLOGY_SERVICE:-http://ontologyservice:8080}
      - INTERNAL_API_GO_ANNOTATION_SERVICE=${INTERNAL_API_GO_ANNOTATION_SERVICE:-http://goannotationservice:8080}
      - INTERNAL_API_PUBLICATION_SERVICE=${INTERNAL_API_PUBLICATION_SERVICE:-http://publicationservice:8080}
      - INTERNAL_API_QUERY_PIPELINE_SERVICE=${INTERNAL_API_QUERY_PIPELINE_SERVICE:-http://querypipelineservice:8080}
      - INTERNAL_KEYCLOAK_ISSUER=${INTERNAL_KEYCLOAK_ISSUER:-http://host.docker.internal:8081/keycloak/realms/${KEYCLOAK_REALM:-ibb}}
      - INTERNAL_DIRECTUS_URL=${INTERNAL_DIRECTUS_URL:-http://directus:8055}
      # BLAST is proxied through this deployment's nginx so its iframe stays
      # same-origin (SequenceServer's CSRF cookie must be first-party).
      - PUBLIC_UI_PAGE_BLAST=${PUBLIC_SERVER}/blast/
      # JBrowse2 is served by the portal. The browser uses the public URL;
      # server-side config fetches use the internal portal URL, since a public
      # localhost URL would point at this web container itself.
      - PUBLIC_UI_PAGE_GENOMEBROWSER=${PORTAL_SERVER}/jbrowse/
      - INTERNAL_UI_PAGE_GENOMEBROWSER=${PORTAL_INTERNAL_URL:-${PORTAL_SERVER}}/jbrowse/
      - PUBLIC_DIRECTUS_URL=${PUBLIC_SERVER}/ibb/directus/
      - AUTH_SECRET=${SSR_OIDC_SESSION_SECRET}
      - AUTH_TRUST_HOST=true
      # nginx allows 16k per header line; Node limits all headers together.
      # The extra Node headroom covers the request line and the other headers.
      - NODE_OPTIONS=--max-http-header-size=32768
      # Keycloak has its own per-server public URL, independent of the portal.
      - KEYCLOAK_ISSUER=${KEYCLOAK_PUBLIC_URL}/realms/${KEYCLOAK_REALM:-ibb}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-ibb-client}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}
    extra_hosts:
      - "host.docker.internal:host-gateway"


  swagger-ui:
    image: swaggerapi/swagger-ui
    restart: always
    environment:
      - BASE_URL=/ibb/swagger-ui
      - "URLS=[
        { url: '${PORTAL_SERVER}/api/genomicsservice/v1/docs', name: 'Genomics Service' },
        { url: '$PUBLIC_SERVER/ibb/api/ontologyservice/v1/q/openapi/', name: 'Ontology Service' }
        ]" 

  es:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    restart: always
    volumes:
      - es-data:/usr/share/elasticsearch/data
      - ./es_bk:/es-bk
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - path.repo=/es-bk
    mem_limit: 512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - 9202:9200
    healthcheck:
      test: 
        [
          "CMD-SHELL",
          "curl -s localhost:9200 | grep -q 'You Know, for Search'"
        ]
      interval: 10s
      timeout: 10s
      retries: 18

  ontologyservice:
    image: docker.gitlab.gwdg.de/medbioinf/devbio/ibb/ontologyservice:1.5.0
    restart: always
    depends_on:
      es:
        condition: service_healthy
    environment:
      - MP_OPENAPI_SERVERS=$PUBLIC_SERVER/ibb/api/ontologyservice/v1/

  imageservice:
    image: docker.gitlab.gwdg.de/medbioinf/devbio/ibb/imageservice:2.0.0
    restart: always
    user: "${UID}:${GID}"
    environment:
      - QUARKUS_OIDC_CREDENTIALS_SECRET=$KEYCLOAK_CLIENT_SECRET
      - QUARKUS_OIDC_AUTH_SERVER_URL=${INTERNAL_KEYCLOAK_ISSUER:-http://host.docker.internal:8081/keycloak/realms/${KEYCLOAK_REALM:-ibb}}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      es:
        condition: service_healthy
    volumes:
      - ${IMAGE_DIR}:/images
      - ${PRIVATE_DATA_DIR}/imageservice:/data:ro

  phenotypeservice:
    image: docker.gitlab.gwdg.de/medbioinf/devbio/ibb/phenotypeservice:1.6.0
    restart: always
    depends_on:
      es:
        condition: service_healthy
      imageservice:
        condition: service_started
    environment:
      - QUARKUS_OIDC_CREDENTIALS_SECRET=$KEYCLOAK_CLIENT_SECRET
      - QUARKUS_OIDC_AUTH_SERVER_URL=${INTERNAL_KEYCLOAK_ISSUER:-http://host.docker.internal:8081/keycloak/realms/${KEYCLOAK_REALM:-ibb}}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${IMAGE_DIR}:/images
      - ${PRIVATE_DATA_DIR}/phenotypeservice:/data:ro

  goannotationservice:
    image: docker.gitlab.gwdg.de/medbioinf/devbio/ibb/goannotationservice:1.6.0
    restart: always
    environment:
      - QUARKUS_OIDC_CREDENTIALS_SECRET=$KEYCLOAK_CLIENT_SECRET
      - QUARKUS_OIDC_AUTH_SERVER_URL=${INTERNAL_KEYCLOAK_ISSUER:-http://host.docker.internal:8081/keycloak/realms/${KEYCLOAK_REALM:-ibb}}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      es:
        condition: service_healthy

  publicationservice:
    image: docker.gitlab.gwdg.de/medbioinf/devbio/ibb/publicationservice:1.6.0
    restart: always
    environment:
      - QUARKUS_OIDC_CREDENTIALS_SECRET=$KEYCLOAK_CLIENT_SECRET
      - QUARKUS_OIDC_AUTH_SERVER_URL=${INTERNAL_KEYCLOAK_ISSUER:-http://host.docker.internal:8081/keycloak/realms/${KEYCLOAK_REALM:-ibb}}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      es:
        condition: service_healthy

  querypipelineservice:
    image: docker.gitlab.gwdg.de/medbioinf/devbio/ibb/querypipelineservice:1.5.0
    restart: always
    environment:
      - PUBLIC_SERVER=$PUBLIC_SERVER/ibb/api/querypipelineservice/v1/

  # Directus uses the shared MySQL in emobase-infra and therefore joins that
  # stack's external Docker network. The web UI and Quarkus services reach the
  # shared Keycloak through the portal origin instead, so their service names
  # do not collide with other species on the shared network.

  directus:
    restart: always
    image: directus/directus:11
    environment: *directus-environment
    volumes:
      - directus-data:/directus/uploads
    healthcheck:
      test:
        - "CMD-SHELL"
        - "wget -qO- http://127.0.0.1:8055/server/health | grep -q 'ok'"
      interval: 10s
      timeout: 10s
      retries: 18
    networks:
      - default
      - emobase-infra

  setup-directus:
    image: directus/directus:11
    # Reuse Directus's network namespace so the bootstrap script can reach the
    # API at 127.0.0.1:8055 and so this job inherits the shared infra network.
    network_mode: "service:directus"
    restart: no
    command: >
      sh -c "pnpm add @directus/sdk &&
        npx directus schema apply /directus/schema.yaml --yes &&
        node /directus/scripts/bootstrap.js"
    volumes:
      - ./directus/scripts:/directus/scripts
      - ./directus/schema.yaml:/directus/schema.yaml
    environment:
      <<: *directus-environment
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    depends_on:
      directus:
        condition: service_healthy
    profiles:
      - setup

networks:
  # Created by emobase-infra. Use the same EMOBASE_INFRA_NETWORK value in all
  # three stacks.
  emobase-infra:
    external: true
    name: ${EMOBASE_INFRA_NETWORK:-emobase-infra}
