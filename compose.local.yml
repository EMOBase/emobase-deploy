# Local development only.
#
# Build the web UI from source instead of pulling it from GHCR. Point
# EMOBASE_WEB_DIR at your checkout; the default assumes it sits next to this
# checkout. Set it in the environment or in .env:
#
#   EMOBASE_WEB_DIR=../emobase-web \
#     docker compose -f compose.yml -f compose.local.yml up -d --build
#
# This file is not loaded automatically (Compose only auto-loads
# compose.override.yml), so a normal `docker compose up -d` always uses the
# published images.
services:
  fe:
    image: emobase-web:local
    build:
      context: ${EMOBASE_WEB_DIR:-../emobase-web}
